[package]
name = "pcfl-backend"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"

[[bin]]
name = "pcfl-backend"
path = "src/main.rs"

[dependencies]
actix-web = "4"
actix-cors = "0.7"
actix-multipart = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.7", features = ["runtime-tokio-native-tls", "postgres", "uuid", "chrono", "json", "macros" ] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
bcrypt = "0.15"
jsonwebtoken = "9"
dotenv = "0.15"
env_logger = "0.11"
log = "0.4"
validator = { version = "0.18", features = ["derive"] }
futures = "0.3"
mime = "0.3"
tokio-util = { version = "0.7", features = ["io"] }
bytes = "1"
anyhow = "1"
thiserror = "1"
actix-governor = "0.6"